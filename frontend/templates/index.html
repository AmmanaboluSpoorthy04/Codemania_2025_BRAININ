<!DOCTYPE html>
<html>
<head>
    <title>Credit Card Fraud Detector</title>
</head>
<body>
    <h2>Credit Card Fraud Detection</h2>

    <form method="POST" action="/predict">
        <label for="time">Transaction Time:</label>
        <input type="text" id="time" name="time" required><br><br>

        <label for="amount">Transaction Amount:</label>
        <input type="text" id="amount" name="amount" required><br><br>

        <button type="submit">Check Transaction</button>
    </form>

    {% if prediction_result %}
        <h3 style="color: green;">{{ prediction_result }}</h3>
    {% endif %}
</body>
</html>
